# FLSUN_notify - Klipper macros
# Based on ghzserg's notify plugin for Zmod (https://github.com/ghzserg/notify).
# install.sh links this file into the config folder and includes it from
# printer.cfg. Updates replace it, so don't edit it; switches are set with
# SAVE_VARIABLE (see README.md).
#
# Zmod calls these macros from its own print and sensor macros. FLSun's
# macros don't, so _NOTIFY_LOOP checks print progress and the filament
# sensor every 10 seconds instead.

[gcode_macro _NOTIFY]
description: Send a notification: _NOTIFY MSG="text" [PHOTO=0] [TYPE=name]
gcode:
    {% set notify_photo = printer.save_variables.variables.notify_photo|default(1)|int %}

    {% set msg = params.MSG|default("Ok")|string %}
    {% set photo = params.PHOTO|default(1)|int %}
    {% set type = params.TYPE|default("ok")|string %}

    {% set var_name = 'notify_' ~ type %}
    {% set type_on = printer.save_variables.variables[var_name]|default(1)|int %}

    {% if photo == 1 and notify_photo == 1 %}
        {% set notifier = "notifier_photo" %}
    {% else %}
        {% set notifier = "notifier" %}
    {% endif %}

    {% if type_on == 1 %}
        {action_call_remote_method("notify",
                             name=notifier,
                             message=msg)}
    {% endif %}

[gcode_macro _NOTIFY_ON_PERCENT]
variable_notified_percent: 0
gcode:
    {% set notify_step = printer.save_variables.variables.notify_percent|default(0)|int %}
    {% set state = printer.print_stats.state %}
    {% set last_notified = printer["gcode_macro _NOTIFY_ON_PERCENT"].notified_percent|int %}

    {% if state not in ["printing", "paused"] %}
        {% if last_notified != 0 %}
            SET_GCODE_VARIABLE MACRO=_NOTIFY_ON_PERCENT VARIABLE=notified_percent VALUE=0
        {% endif %}
    {% elif notify_step > 0 %}
        {% set progress = printer.virtual_sdcard.progress|default(0)|float %}
        {% set current_percent = (progress * 100)|round(1)|float %}
        {% set next_threshold = ((last_notified // notify_step) + 1) * notify_step %}

        {% if current_percent >= next_threshold and current_percent > last_notified and current_percent < 100 %}
            {% set filename = printer.print_stats.filename|default("Unknown")|string %}
            {% set basename = filename.split('/')[-1].split('\\')[-1] %}

            {% set et = printer.extruder.temperature|default(0)|round(1) %}
            {% set et_t = printer.extruder.target|default(0)|round(1) %}
            {% set bt = printer.heater_bed.temperature|default(0)|round(1) %}
            {% set bt_t = printer.heater_bed.target|default(0)|round(1) %}

            {% set msg = "%s (%d%%) | %.1f/%.1f°C | %.1f/%.1f°C" |
                format(basename, current_percent|int, et, et_t, bt, bt_t) %}

            _NOTIFY MSG="{msg}"

            SET_GCODE_VARIABLE MACRO=_NOTIFY_ON_PERCENT VARIABLE=notified_percent VALUE={current_percent|int}
        {% endif %}
    {% endif %}

# FLSun's runout_gcode pauses the print but sends nothing; this adds the
# "Filament runout detected" message (switch: notify_filament).
[gcode_macro _NOTIFY_ON_FILAMENT]
variable_sensor: "filament_switch_sensor filament_sensor"
variable_notified: 0
gcode:
    {% set state = printer.print_stats.state %}
    {% if sensor in printer %}
        {% set s = printer[sensor] %}
        {% set out = s.enabled and not s.filament_detected and state in ["printing", "paused"] %}
        {% if out and notified == 0 %}
            SET_GCODE_VARIABLE MACRO=_NOTIFY_ON_FILAMENT VARIABLE=notified VALUE=1
            _NOTIFY MSG="Filament runout detected" TYPE=filament
        {% elif not out and notified == 1 %}
            SET_GCODE_VARIABLE MACRO=_NOTIFY_ON_FILAMENT VARIABLE=notified VALUE=0
        {% endif %}
    {% endif %}

[delayed_gcode _NOTIFY_LOOP]
initial_duration: 10
gcode:
    # Reschedule first: an error below (e.g. Moonraker not connected yet)
    # would otherwise stop the loop.
    UPDATE_DELAYED_GCODE ID=_NOTIFY_LOOP DURATION=10
    _NOTIFY_ON_FILAMENT
    _NOTIFY_ON_PERCENT

[gcode_macro UPDATE_NOTIFY]
description: Apply flsun_notify.txt and restart Moonraker
gcode:
    {action_call_remote_method("flsun_notify_update")}
