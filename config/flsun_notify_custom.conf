# FLSUN_notify - your Moonraker overrides
# install.sh creates this file once and never overwrites it. A section here
# replaces the matching options in flsun_notify.conf. Restart Moonraker
# after editing.
#
# Turn off one of Moonraker's print notifications (print_start,
# print_complete, print_error, print_cancelled, print_paused,
# print_resumed):
#
# [notifier print_start]
# events: none
#
# Send without a camera photo:
#
# [notifier print_complete]
# attach:
#
# With a Discord webhook, send plain text instead of FlashForgeUI-style
# embeds:
#
# [flsun_notify]
# discord_embeds: False
